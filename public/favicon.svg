<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Domhan an Fiosracht sigil: a diamond/lozenge with an inner eye -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#5c8a6e"/>
    </linearGradient>
  </defs>
  <!-- outer diamond -->
  <polygon points="64,8 120,64 64,120 8,64" fill="none" stroke="url(#g)" stroke-width="5" stroke-linejoin="round"/>
  <!-- inner diamond -->
  <polygon points="64,30 98,64 64,98 30,64" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linejoin="round" opacity=".55"/>
  <!-- centre eye dot -->
  <circle cx="64" cy="64" r="7" fill="url(#g)"/>
</svg>
